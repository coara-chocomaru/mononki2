name: mtk-logo-poc

on:
  push:
    branches: [ main, master ]
    paths:
      - 'input/logo.bin'
      - 'scripts/mtk_logo_tool.py'
      - '.github/workflows/mtk-logo-poc.yml'
  workflow_dispatch:
    inputs:
      pattern:
        description: 'Pixel color for PoC images'
        required: true
        default: 'white'
        type: choice
        options: [white, black, red, green, blue]
      combo_strategy:
        description: 'How to distribute vuln vectors across images'
        required: true
        default: 'round_robin'
        type: choice
        options: [round_robin, all_same, safe_only]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  INPUT_LOGO:   'input/logo.bin'
  TOOL:         'scripts/mtk_logo_tool.py'
  OUT_DIR:      'out'

jobs:
  build-poc:
    name: Build PoC logo.bin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify inputs
        shell: bash
        run: |
          set -euo pipefail
          [ -f "${INPUT_LOGO}" ] || { echo "input/logo.bin missing"; exit 1; }
          [ -f "${TOOL}" ]       || { echo "tool missing"; exit 1; }
          python -m py_compile "${TOOL}"
          ls -l "${INPUT_LOGO}" "${TOOL}"
          sha256sum "${INPUT_LOGO}" > "${INPUT_LOGO}.sha256"
          cat "${INPUT_LOGO}.sha256"

      - name: Analyze image count
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          python "${TOOL}" analyze "${INPUT_LOGO}" > out_analyze.txt || true
          cat out_analyze.txt
          count=$(grep -cE '^[[:space:]]*[0-9]+[[:space:]]+0x' out_analyze.txt || true)
          echo "image_count=${count}" >> "$GITHUB_OUTPUT"
          echo "detected images: ${count}"
          [ "${count}" -ge 1 ] || { echo "no image headers parsed"; exit 1; }

      - name: Build safe variant (pixel-only)
        if: ${{ inputs.combo_strategy == 'safe_only' || github.event_name != 'workflow_dispatch' }}
        shell: bash
        env:
          PATTERN: ${{ inputs.pattern || 'white' }}
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          count=${{ steps.analyze.outputs.image_count }}
          tmp="${OUT_DIR}/_x.bin"
          cp "${INPUT_LOGO}" "${tmp}"
          i=0
          while [ "${i}" -lt "${count}" ]; do
            python "${TOOL}" poc "${tmp}" -i "${i}" \
              --vuln pattern --pattern "${PATTERN}" \
              -o "${tmp}.next"
            mv "${tmp}.next" "${tmp}"
            echo "safe: image #${i} -> ${PATTERN}"
            i=$((i+1))
          done
          mv "${tmp}" "${OUT_DIR}/logo_poc_safe.bin"

      - name: Build ULTIMATE variant (multi-vector round-robin)
        if: ${{ inputs.combo_strategy == 'round_robin' || inputs.combo_strategy == 'all_same' }}
        shell: bash
        env:
          PATTERN: ${{ inputs.pattern || 'white' }}
          COMBO:   ${{ inputs.combo_strategy }}
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}"
          count=${{ steps.analyze.outputs.image_count }}
          vectors=(shift_neg alloc_short div_zero huge_w_h)
          vlen=${#vectors[@]}
          tmp="${OUT_DIR}/_x.bin"
          cp "${INPUT_LOGO}" "${tmp}"
          i=0
          while [ "${i}" -lt "${count}" ]; do
            if [ "${COMBO}" = "all_same" ]; then
              v="alloc_short"
            else
              v="${vectors[$(( i % vlen ))]}"
            fi
            python "${TOOL}" poc "${tmp}" -i "${i}" \
              --vuln "${v}" --pattern "${PATTERN}" \
              -o "${tmp}.next"
            mv "${tmp}.next" "${tmp}"
            echo "ultimate: image #${i} -> ${v}"
            i=$((i+1))
          done
          mv "${tmp}" "${OUT_DIR}/logo_poc_ULTIMATE.bin"

      - name: Inventory
        shell: bash
        run: |
          set -euo pipefail
          ls -l "${OUT_DIR}"
          sha256sum "${OUT_DIR}"/*.bin | tee "${OUT_DIR}/SHA256SUMS.txt"
          cp out_analyze.txt "${OUT_DIR}/analyze.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logo-poc
          path: |
            ${{ env.OUT_DIR }}/*.bin
            ${{ env.OUT_DIR }}/SHA256SUMS.txt
            ${{ env.OUT_DIR }}/analyze.txt
          retention-days: 30
          if-no-files-found: error
