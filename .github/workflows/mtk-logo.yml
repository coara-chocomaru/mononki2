name: MTK Logo PoC Build + Cert Bypass Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'input/logo.bin'
      - 'logo_tool.py'
      - 'scripts/logo_tool.py'
      - '.github/workflows/mtk-logo.yml'
  workflow_dispatch:
    inputs:
      color:
        description: 'RGB565 fill color for raw variants'
        required: true
        default: 'white'
        type: choice
        options: [white, black, red, green, blue]
      bypass_mode:
        description: 'Certificate bypass mode (applied to ALL generated logo.bin)'
        required: true
        default: 'override'
        type: choice
        options: [override, wrap]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  INPUT_LOGO: 'input/logo.bin'
  TOOL_1: 'logo_tool.py'
  TOOL_2: 'scripts/logo_tool.py'
  OUT_DIR: 'out'
  PATCHED_DIR: 'patched'
  ARTIFACT_DIR: 'artifact'

jobs:
  pipeline:
    name: Build PoC -> cert bypass (all) -> zip
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve tool path
        id: tool
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${TOOL_1}" ]; then
            echo "path=${TOOL_1}" >> "$GITHUB_OUTPUT"
          elif [ -f "${TOOL_2}" ]; then
            echo "path=${TOOL_2}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::logo_poc.py not found"
            exit 1
          fi

      - name: Verify inputs
        shell: bash
        run: |
          set -euo pipefail
          [ -f "${INPUT_LOGO}" ] || { echo "::error::${INPUT_LOGO} missing"; exit 1; }
          python -m py_compile "${{ steps.tool.outputs.path }}"
          sha256sum "${INPUT_LOGO}" | tee "${INPUT_LOGO}.sha256"

      - name: Create dirs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUT_DIR}" "${PATCHED_DIR}" "${ARTIFACT_DIR}"

      - name: Info & data structure probes
        shell: bash
        run: |
          set -euo pipefail
          python "${{ steps.tool.outputs.path }}" info          "${INPUT_LOGO}" > "${OUT_DIR}/info.txt"
          python "${{ steps.tool.outputs.path }}" data_hex      "${INPUT_LOGO}" 0 0x100 > "${OUT_DIR}/data_hex.txt"
          python "${{ steps.tool.outputs.path }}" data_bmp_check "${INPUT_LOGO}" > "${OUT_DIR}/data_bmp_check.txt"
          cat "${OUT_DIR}/info.txt"

      - name: Generate ALL PoC variants
        shell: bash
        run: |
          set -euo pipefail
          python "${{ steps.tool.outputs.path }}" all "${INPUT_LOGO}" "${OUT_DIR}"

      - name: Generate raw variants (RGB565 full + keep size)
        shell: bash
        env:
          COLOR: ${{ inputs.color || 'white' }}
        run: |
          set -euo pipefail
          python "${{ steps.tool.outputs.path }}" replace_raw \
            "${INPUT_LOGO}" 1280 800 "${OUT_DIR}/logo_raw_${COLOR}_full.bin" "${COLOR}"
          python "${{ steps.tool.outputs.path }}" replace_raw \
            "${INPUT_LOGO}" 1280 800 "${OUT_DIR}/logo_raw_${COLOR}_keep.bin" "${COLOR}" 1

      - name: Install lkpatcher
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/R0rt1z2/lkpatcher
          python -m lkpatcher --help 2>&1 | tee "${ARTIFACT_DIR}/lkpatcher_help.txt" || true

      - name: Apply cert bypass to ALL generated logo.bin
        shell: bash
        env:
          BYPASS_MODE: ${{ inputs.bypass_mode || 'override' }}
        run: |
          set -euo pipefail
          : > "${ARTIFACT_DIR}/patch_targets.txt"
          : > "${ARTIFACT_DIR}/patch_results.txt"
          : > "${ARTIFACT_DIR}/failures.txt"

          # Enumerate every generated logo.bin (skip the untouched original copy)
          for f in "${OUT_DIR}"/*.bin; do
            [ -e "$f" ] || continue
            [ "$(basename "$f")" = "logo_original.bin" ] && continue
            echo "$f" >> "${ARTIFACT_DIR}/patch_targets.txt"
          done

          total=$(wc -l < "${ARTIFACT_DIR}/patch_targets.txt")
          echo "targets: ${total}"

          ok=0; fail=0
          while IFS= read -r f; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .bin)
            out="${PATCHED_DIR}/${name}_patched.img"
            echo "=== ${name} (mode=${BYPASS_MODE}) ===" | tee -a "${ARTIFACT_DIR}/patch_results.txt"
            if python -m lkpatcher "$f" \
                 -o "$out" \
                 --cert-bypass "${BYPASS_MODE}" \
                 >> "${ARTIFACT_DIR}/patch_results.txt" 2>&1; then
              echo "OK   ${name} -> $(stat -c%s "$out") bytes" \
                | tee -a "${ARTIFACT_DIR}/patch_results.txt"
              ok=$((ok+1))
            else
              echo "FAIL ${name}" \
                | tee -a "${ARTIFACT_DIR}/patch_results.txt" \
                | tee -a "${ARTIFACT_DIR}/failures.txt"
              fail=$((fail+1))
            fi
          done < "${ARTIFACT_DIR}/patch_targets.txt"

          echo "patched total=${total} ok=${ok} failed=${fail}"
          {
            echo "total=${total}"
            echo "ok=${ok}"
            echo "fail=${fail}"
          } > "${ARTIFACT_DIR}/patch_summary.txt"

          if [ "$ok" -eq 0 ] && [ "$fail" -gt 0 ]; then
            echo "::warning::lkpatcher failed on ALL targets (see failures.txt). Unpatched PoCs will still be packaged."
          fi

      - name: Verify patched outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          : > "${ARTIFACT_DIR}/patched_inventory.txt"
          for f in "${PATCHED_DIR}"/*_patched.img; do
            size=$(stat -c%s "$f")
            sha=$(sha256sum "$f" | cut -c1-16)
            echo "${f} size=${size} sha256[0:16]=${sha}" \
              | tee -a "${ARTIFACT_DIR}/patched_inventory.txt"
          done

      - name: Populate artifact dir
        shell: bash
        run: |
          set -euo pipefail
          cp "${OUT_DIR}"/*.bin              "${ARTIFACT_DIR}/" 2>/dev/null || true
          cp "${OUT_DIR}"/*.txt              "${ARTIFACT_DIR}/" 2>/dev/null || true
          cp "${PATCHED_DIR}"/*_patched.img  "${ARTIFACT_DIR}/" 2>/dev/null || true
          cp "${INPUT_LOGO}.sha256"          "${ARTIFACT_DIR}/" 2>/dev/null || true
          {
            echo "# MTK logo PoC + cert bypass artifact"
            echo "- bypass_mode: ${{ inputs.bypass_mode || 'override' }}"
            echo "- color      : ${{ inputs.color || 'white' }}"
            echo "- commit     : ${{ github.sha }}"
            echo "- branch     : ${{ github.ref_name }}"
            echo "- repo       : ${{ github.repository }}"
            echo
            echo "cert2 bypass on LK and logo share the same mechanism;"
            echo "all generated logo.bin were patched via lkpatcher --cert-bypass."
            echo
            cat "${ARTIFACT_DIR}/patch_summary.txt" 2>/dev/null || true
          } > "${ARTIFACT_DIR}/README.md"
          sha256sum "${ARTIFACT_DIR}"/* > "${ARTIFACT_DIR}/SHA256SUMS.txt" 2>/dev/null || true
          ls -la "${ARTIFACT_DIR}"

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_name="logo-poc-with-cert-bypass.zip"
          ( cd "${ARTIFACT_DIR}" && zip -r "../${zip_name}" . )
          ls -la "${zip_name}"
          sha256sum "${zip_name}" | tee "${zip_name}.sha256"
          echo "zip_name=${zip_name}" >> "$GITHUB_ENV"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: logo-poc-cert-bypass
          path: |
            ${{ env.zip_name }}
            ${{ env.zip_name }}.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### MTK Logo PoC + Cert Bypass"
            echo
            echo "- **Bypass mode**: \`${{ inputs.bypass_mode || 'override' }}\`"
            echo "- **Color**: \`${{ inputs.color || 'white' }}\`"
            echo "- **Targets**: $(wc -l < "${ARTIFACT_DIR}/patch_targets.txt" 2>/dev/null || echo 0)"
            echo
            echo "#### Patch results"
            echo '```'
            cat "${ARTIFACT_DIR}/patch_summary.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "#### Failures (expected for header/magic corruption PoCs)"
            echo '```'
            cat "${ARTIFACT_DIR}/failures.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "#### Artifact contents"
            echo '```'
            ls -la "${ARTIFACT_DIR}" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
