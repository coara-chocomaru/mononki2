name: mtk-logo-poc

on:
  push:
    branches: [ main, master ]
    paths:
      - 'input/logo.bin'
      - 'logo_poc.py'
      - 'scripts/logo_tool.py'
      - '.github/workflows/mtk-logo.yml'
  workflow_dispatch:
    inputs:
      color:
        description: 'RGB565 fill color for replace_raw'
        required: true
        default: 'white'
        type: choice
        options: [white, black, red, green, blue]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  INPUT_LOGO: 'input/logo.bin'
  TOOL_1: 'logo_tool.py'
  TOOL_2: 'scripts/logo_tool.py'
  OUT_DIR: 'out'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: resolve tool
        id: tool
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${TOOL_1}" ]; then
            echo "path=${TOOL_1}" >> "$GITHUB_OUTPUT"
          elif [ -f "${TOOL_2}" ]; then
            echo "path=${TOOL_2}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::logo_poc.py not found"
            exit 1
          fi

      - name: verify
        shell: bash
        run: |
          set -euo pipefail
          [ -f "${INPUT_LOGO}" ] || { echo "::error::${INPUT_LOGO} missing"; exit 1; }
          python -m py_compile "${{ steps.tool.outputs.path }}"
          sha256sum "${INPUT_LOGO}" | tee "${INPUT_LOGO}.sha256"

      - name: mkdir out
        run: mkdir -p "${OUT_DIR}"

      - name: info
        shell: bash
        run: |
          set -euo pipefail
          python "${{ steps.tool.outputs.path }}" info "${INPUT_LOGO}" \
            > "${OUT_DIR}/info.txt"
          cat "${OUT_DIR}/info.txt"

      - name: data_hex (first 0x100)
        shell: bash
        run: |
          set -euo pipefail
          python "${{ steps.tool.outputs.path }}" data_hex "${INPUT_LOGO}" 0 0x100 \
            > "${OUT_DIR}/data_hex.txt"
          cat "${OUT_DIR}/data_hex.txt"

      - name: data_bmp_check
        shell: bash
        run: |
          set -euo pipefail
          python "${{ steps.tool.outputs.path }}" data_bmp_check "${INPUT_LOGO}" \
            > "${OUT_DIR}/data_bmp_check.txt"
          cat "${OUT_DIR}/data_bmp_check.txt"

      - name: generate ALL PoC variants
        shell: bash
        run: |
          set -euo pipefail
          python "${{ steps.tool.outputs.path }}" all "${INPUT_LOGO}" "${OUT_DIR}"

      - name: replace_raw white (valid-size RGB565)
        shell: bash
        env:
          COLOR: ${{ inputs.color || 'white' }}
        run: |
          set -euo pipefail
          python "${{ steps.tool.outputs.path }}" replace_raw \
            "${INPUT_LOGO}" 1280 800 "${OUT_DIR}/logo_raw_${COLOR}_full.bin" "${COLOR}"

      - name: replace_raw white (keep original body size)
        shell: bash
        env:
          COLOR: ${{ inputs.color || 'white' }}
        run: |
          set -euo pipefail
          python "${{ steps.tool.outputs.path }}" replace_raw \
            "${INPUT_LOGO}" 1280 800 "${OUT_DIR}/logo_raw_${COLOR}_keep.bin" "${COLOR}" 1

      - name: inventory
        shell: bash
        run: |
          set -euo pipefail
          ls -l "${OUT_DIR}"
          sha256sum "${OUT_DIR}"/*.bin > "${OUT_DIR}/SHA256SUMS.txt"
          cat "${OUT_DIR}/SHA256SUMS.txt"

      - name: summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### MTK logo PoC artifacts"
            echo
            echo "| file | size | sha256[0:16] |"
            echo "|---|---|---|"
            for f in "${OUT_DIR}"/*.bin; do
              s=$(stat -c%s "${f}")
              h=$(sha256sum "${f}" | cut -c1-16)
              echo "| $(basename "${f}") | ${s} | ${h} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: logo-poc
          path: |
            ${{ env.OUT_DIR }}/*.bin
            ${{ env.OUT_DIR }}/SHA256SUMS.txt
            ${{ env.OUT_DIR }}/info.txt
            ${{ env.OUT_DIR }}/data_hex.txt
            ${{ env.OUT_DIR }}/data_bmp_check.txt
            ${{ env.INPUT_LOGO }}.sha256
          retention-days: 30
          if-no-files-found: error
