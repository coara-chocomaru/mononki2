name: preloader-vuln-poc
on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect provided sd_boot.img
        run: |
          if [ -f sd_boot.img ]; then
            echo "size=$(stat -c%s sd_boot.img)"
            xxd -l 32 sd_boot.img || hexdump -C -n 32 sd_boot.img
          else
            echo "sd_boot.img not present; poc will synthesize mode0"
          fi

      - name: Run PoC
        run: python3 poc.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-artifacts
          path: |
            sd_boot.img
            patch_boot.img
            poc_report.json
          if-no-files-found: warn
